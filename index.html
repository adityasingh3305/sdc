<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="A high-performance Reddit scroller with grid browse and infinite reel." />
    <meta name="theme-color" content="#000000" />
    <title>RedditScroller – Premium Reddit Feed</title>
    
    <!-- Font Preloading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;800&family=Geist+Mono:wght@400;600&display=swap" rel="preload" as="style">
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600;800&family=Geist+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  </head>
  <body>
    <!-- ── Top Navigation Bar ───────────────────────────────────── -->
    <nav class="top-bar" id="topBar" aria-label="Main navigation">
      <div class="top-bar-inner">
        <div class="app-brand">Reddit<span>Scroller</span></div>
        <div class="search-wrap">
          <div class="search-container">
            <i class="bi bi-search search-icon" aria-hidden="true"></i>
            <input type="text" class="search-input" placeholder="Search subreddits..." id="subredditSearch" autocomplete="off" aria-label="Search subreddits" aria-autocomplete="list" role="combobox" aria-expanded="false" aria-controls="suggestions">
            <div id="suggestions" class="suggestions-container" role="listbox" aria-label="Subreddit suggestions"></div>
          </div>
        </div>

        <div class="accent-toggle-wrap">
          <button class="icon-btn" id="accentToggle" title="Accent color" aria-label="Choose accent color" aria-haspopup="true" aria-expanded="false" aria-controls="accentPopover"><i class="bi bi-palette"></i></button>
          <div class="accent-popover" id="accentPopover" role="menu" aria-label="Accent color options">
            <button class="accent-swatch active" data-accent="reddit" style="background:#ff4500" aria-label="Reddit orange" role="menuitemradio" aria-checked="true"></button>
            <button class="accent-swatch" data-accent="blue" style="background:#3b82f6" aria-label="Blue" role="menuitemradio" aria-checked="false"></button>
            <button class="accent-swatch" data-accent="green" style="background:#22c55e" aria-label="Green" role="menuitemradio" aria-checked="false"></button>
            <button class="accent-swatch" data-accent="purple" style="background:#a855f7" aria-label="Purple" role="menuitemradio" aria-checked="false"></button>
            <button class="accent-swatch" data-accent="gold" style="background:#eab308" aria-label="Gold" role="menuitemradio" aria-checked="false"></button>
          </div>
        </div>

        <button class="icon-btn" id="blacklistBtn" title="Filter blacklisted words" aria-label="Open blacklist filter"><i class="bi bi-slash-circle"></i></button>
      </div>
      <div class="filter-row">
        <div class="sort-pills" id="sortPills" role="group" aria-label="Sort posts by">
          <button class="sort-pill active" data-sort="hot" aria-pressed="true"><i class="bi bi-fire"></i> Hot</button>
          <button class="sort-pill" data-sort="new" aria-pressed="false"><i class="bi bi-stars"></i> New</button>
          <div class="sort-menu-wrapper">
            <button class="sort-pill has-submenu" data-sort="top" aria-pressed="false" aria-haspopup="true" aria-expanded="false" aria-controls="topSubmenu"><i class="bi bi-bar-chart-fill"></i> Top <i class="bi bi-chevron-down submenu-arrow"></i></button>
            <div class="sort-submenu" id="topSubmenu" role="group" aria-label="Top posts time range">
              <button class="sort-time" data-time="hour">Hour</button>
              <button class="sort-time active" data-time="day">Day</button>
              <button class="sort-time" data-time="week">Week</button>
              <button class="sort-time" data-time="month">Month</button>
              <button class="sort-time" data-time="year">Year</button>
              <button class="sort-time" data-time="all">All</button>
            </div>
          </div>
          <button class="sort-pill" data-sort="rising" aria-pressed="false"><i class="bi bi-graph-up-arrow"></i> Rising</button>
          <div class="sort-menu-wrapper">
            <button class="sort-pill has-submenu" data-sort="controversial" aria-pressed="false" aria-haspopup="true" aria-expanded="false" aria-controls="controversialSubmenu"><i class="bi bi-lightning-charge-fill"></i> Controversial <i class="bi bi-chevron-down submenu-arrow"></i></button>
            <div class="sort-submenu" id="controversialSubmenu" role="group" aria-label="Controversial posts time range">
              <button class="sort-time" data-time="hour">Hour</button>
              <button class="sort-time active" data-time="day">Day</button>
              <button class="sort-time" data-time="week">Week</button>
              <button class="sort-time" data-time="month">Month</button>
              <button class="sort-time" data-time="year">Year</button>
              <button class="sort-time" data-time="all">All</button>
            </div>
          </div>
        </div>
      </div>
    </nav>

    <!-- ── Home Flex Grid ───────────────────────────────────────── -->
    <div id="home" class="home-flex">
      <div id="homeGrid" class="home-grid" role="feed" aria-label="Reddit posts grid">
        <!-- Grid items will be injected here -->
      </div>
      <div id="gridLoader" class="grid-loader"><div class="spinner"></div></div>
    </div>

    <!-- ── Reel View Overlay ─────────────────────────────────────── -->
    <div id="reelView" class="reel-view">
      <button class="reel-close" id="closeReel" aria-label="Close reel view"><i class="bi bi-arrow-left"></i></button>
      <div id="app" class="reel-feed">
        <div id="loader" class="loader"><div class="spinner"></div></div>
      </div>

      <!-- ── Comment Sheet ──────────────────────────────────────── -->
      <div id="commentSheet" class="comment-sheet" role="dialog" aria-label="Comments" aria-modal="true">
        <div class="comment-drag-handle" aria-hidden="true"></div>
        <div class="comment-header">
          <div class="comment-title">
            <span><i class="bi bi-chat-text-fill"></i> Comments</span>
            <span id="commentCount">0 comments</span>
          </div>
          <button class="comment-close" id="closeComments" title="Close" aria-label="Close comments"><i class="bi bi-x-lg"></i></button>
        </div>
        <div id="commentList" class="comment-list">
          <!-- Comments will be injected here -->
        </div>
        <div id="commentLoader" class="comment-loader">
          <div class="spinner"></div>
        </div>
      </div>
    </div>

    <!-- ── Blacklist Modal ────────────────────────────────────────── -->
    <div id="blacklistModal" class="modal-overlay" style="display:none;" role="dialog" aria-label="Blacklist filter" aria-modal="true">
      <div class="modal-box">
        <h3><i class="bi bi-slash-circle"></i> Blacklist</h3>
        <p class="modal-hint">Posts containing these words in the title or subreddit will be hidden.</p>
        <div class="blacklist-tags" id="blacklistTags"></div>
        <div class="blacklist-input-row">
          <input type="text" id="blacklistInput" placeholder="Add keyword..." class="search-input" aria-label="Add blacklist keyword">
          <button id="addBlacklist" class="pill-btn" aria-label="Add keyword"><i class="bi bi-plus-lg"></i></button>
        </div>
        <button id="closeModal" class="pill-btn close-btn">Done</button>
      </div>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
